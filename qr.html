<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3f2"><title>Your little QR code</title><link rel="stylesheet" href="style.css"><style>.qr-card{text-align:center}.qr-card h1{font-size:40px}.qr-card .qr-art{display:block;width:min(100%,440px);height:auto;margin:20px auto;border:1px solid #eae5e4;border-radius:14px}.qr-note{font-size:11px;color:#989197;line-height:1.7;max-width:390px;margin:0 auto 20px}.qr-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}</style></head>
<body><main class="shell"><header class="brand"><span class="brand-mark">♡</span> a little note for you</header><section class="card qr-card"><div class="kicker">A little way back here</div><h1>Your page,<br>in a little square.</h1><p class="intro">A soft, high-contrast code for the published page.</p><img class="qr-art" src="qr-code.png" alt="QR code for the public website"><p class="qr-note">This code points to <a href="https://jusrandtzn.github.io/a-little-note-for-you/">https://jusrandtzn.github.io/a-little-note-for-you/</a>. Anyone who scans it can open the site.</p><div class="qr-actions"><a class="primary" href="qr-code.png" download="little-note-qr.png">Save PNG <span>↓</span></a><a class="secondary" href="qr-code.svg" download="little-note-qr.svg">Save SVG</a></div></section></main></body></html>
